# Include inside the existing HTTPS server listening on 8443.
# Remove any existing location = /docs block before including this file.
location = /docs {
    return 308 /docs/;
}

location = /docs/identity.json {
    proxy_pass http://127.0.0.1:3101/docs-json;
}

location = /docs/learning.json {
    proxy_pass http://127.0.0.1:3102/docs-json;
}

location = /docs/submission.json {
    proxy_pass http://127.0.0.1:3103/docs-json;
}

location ^~ /docs/ {
    proxy_pass http://127.0.0.1:3105;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
